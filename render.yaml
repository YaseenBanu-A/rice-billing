# Render Blueprint for A.J RICE TRADERS billing: one PostgreSQL database + one web service
# (the web service serves both the API and the app, so there is a single address and no CORS setup).
#
# Deploy: push this repository to GitHub (private) → Render → New → Blueprint → pick the repository.
# Render asks for the values marked `sync: false` (ADMIN_PASSWORD).

databases:
  - name: aj-rice-db
    databaseName: ajrice
    user: ajrice
    region: singapore # closest Render region to Tamil Nadu
    # FREE plan: expires 30 days after creation (deleted after a grace period unless upgraded), 1 GB storage,
    # no backups. Download a backup regularly (Settings → Backup) and upgrade to a paid plan before relying on it.
    plan: free
    postgresMajorVersion: "17"
    ipAllowList: [] # no access from the internet; only Render services in this account can connect

services:
  - type: web
    name: aj-rice-billing
    runtime: node
    region: singapore
    # FREE plan: sleeps after 15 minutes without visits; the next visit wakes it (takes about a minute).
    plan: free
    # npm ci also runs `prisma generate` (postinstall); build compiles the app
    buildCommand: npm ci --include=dev && npm run build
    # applies any pending database migrations (safe to repeat), then starts the server
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Kolkata
      # Internal connection string (private network, never exposed)
      - key: DATABASE_URL
        fromDatabase:
          name: aj-rice-db
          property: connectionString
      # Signs sign-in tokens; generated once by Render, never shown or committed
      - key: JWT_SECRET
        generateValue: true
      # First administrator, created on the very first start only
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
